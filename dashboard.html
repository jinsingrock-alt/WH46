<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA Earn Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0f172a;
color:white;
padding-bottom:50px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111827;
position:sticky;
top:0;
}

.logo{
font-size:18px;
font-weight:bold;
}

.btn{
background:#22c55e;
padding:8px 12px;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.container{
padding:15px;
}

.section{
background:#1e293b;
padding:15px;
margin-top:15px;
border-radius:10px;
}

.title{
font-size:16px;
margin-bottom:10px;
color:#38bdf8;
font-weight:bold;
}

.item{
padding:8px 0;
border-bottom:1px solid #334155;
font-size:14px;
}

.item:last-child{
border:none;
}

.card-btn{
margin-top:10px;
background:#3b82f6;
padding:10px;
border:none;
color:white;
width:100%;
border-radius:8px;
}

.logout{
background:#ef4444;
margin-top:10px;
padding:10px;
border:none;
width:100%;
color:white;
border-radius:8px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="logo">LOGO</div>
<button class="btn">Withdraw</button>
</div>

<div class="container">

<!-- TASK -->
<div class="section">
<div class="title">📋 TASK</div>
<div class="item">Banner Image</div>
<div class="item">WA Earn Rewards</div>
<div class="item">VIP WA Tasks</div>
</div>

<!-- EARNINGS -->
<div class="section">
<div class="title">💰 EARNINGS</div>
<div class="item">Total Earnings</div>
<div class="item">Total Withdraw</div>
<div class="item">Earnings History</div>
</div>

<!-- INVITE -->
<div class="section">
<div class="title">🎁 INVITE & EARN</div>
<div class="item">Gift Banner</div>
<div class="item">Referral Dashboard</div>
<div class="item">Referral Terms</div>
</div>

<!-- PROFILE -->
<div class="section">
<div class="title">👤 PROFILE</div>
<div class="item">Current Balance</div>
<div class="item">User Name</div>
<div class="item">User ID</div>
<div class="item">Balance</div>
<div class="item">Completed Tasks</div>

<button class="card-btn">Add Bank Account</button>
<button class="card-btn">Add UPI ID</button>

<button class="logout">Logout</button>
</div>

</div>

</body>
</html>
